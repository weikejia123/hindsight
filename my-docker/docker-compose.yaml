# Hindsight Docker Compose — MiniMax M2.7 + Ollama bge-m3
#
# LLM: MiniMax M2.7（通过 MiniMax API）
# Embeddings: Ollama bge-m3（通过宿主机 Ollama，host.docker.internal）
# 数据库: PostgreSQL 18 + pgvector（容器内）
#
# 使用方法:
#   cd my-docker
#   cp .env.example .env && vi .env    # 首次填写密钥
#   docker compose up -d               # 启动
#   docker compose logs -f             # 查看日志
#
# 停止:
#   docker compose down                # 停止并清理
#   docker compose down -v             # 停止并清理数据卷（危险！）

name: hindsight

services:
  # ── PostgreSQL 18 + pgvector ──
  db:
    image: pgvector/pgvector:pg18
    container_name: hindsight-db
    restart: unless-stopped
    # 如需外部连接可取消注释（5432 可能被本地 PG 占用，使用 5434）
    # ports:
    #   - "5434:5432"
    environment:
      POSTGRES_USER: hindsight_user
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD?请设置 HINDSIGHT_DB_PASSWORD}
      POSTGRES_DB: hindsight_db
    volumes:
      # 生产环境使用 bind mount，避免 docker compose down -v 误删数据
      - ../my-docker-vol/hindsight/pg_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight_user -d hindsight_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hindsight-net

  # ── Hindsight API + Control Plane ──
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight-app
    restart: unless-stopped
    ports:
      - "8888:8888"    # API
      - "9999:9999"    # Control Plane 管理面板
    environment:
      # ── LLM: MiniMax M2.7 ──
      # 注意：Hindsight 源码中 minimax provider 写死了 api.minimax.io（缺 i）
      # 所以用 openai provider + 自定义 base_url 绕过硬编码错误
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: https://api.minimaxi.com/v1
      HINDSIGHT_API_LLM_API_KEY: ${MINIMAX_API_KEY?请设置 MINIMAX_API_KEY}
      HINDSIGHT_API_LLM_MODEL: MiniMax-M2.7

      # ── Embeddings: Ollama bge-m3（宿主机） ──
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: bge-m3
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: not-needed

      # ── 数据库 ──
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight_user:${HINDSIGHT_DB_PASSWORD?请设置 HINDSIGHT_DB_PASSWORD}@db:5432/hindsight_db

      # ── API 配置 ──
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: 8888
      HINDSIGHT_API_LOG_LEVEL: info

      # ── 控制面板 ──
      HINDSIGHT_CP_DATAPLANE_API_URL: http://localhost:8888

      # 避免 HuggingFace 下载失败影响启动
      HF_ENDPOINT: https://hf-mirror.com
      # 抑制冗长的 transformers 日志
      TRANSFORMERS_VERBOSITY: error
      HF_HUB_VERBOSITY: error
      TOKENIZERS_PARALLELISM: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hindsight-net

networks:
  hindsight-net:
    driver: bridge

# 数据持久化在 my-docker-vol/hindsight/pg_data/（bind mount）
# 不使用 Docker named volume，避免误删
